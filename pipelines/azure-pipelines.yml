trigger:
  branches:
    include: [ main ]

variables:
  imageRepository: azure-dotnet10-react-bff-entra-starter
  dockerfilePath: src/backend/Starter.Bff/Dockerfile
  tag: $(Build.BuildId)

stages:
- stage: Build
  jobs:
  - job: BuildAndTest
    pool: { vmImage: ubuntu-latest }
    steps:
    - task: UseDotNet@2
      inputs: { packageType: sdk, version: '10.0.x' }
    - task: NodeTool@0
      inputs: { versionSpec: '22.x' }
    - script: dotnet restore src/backend/Starter.sln && dotnet build src/backend/Starter.sln -c Release --no-restore
      displayName: Build .NET
    - script: cd src/frontend/starter-web && npm ci && npm run build
      displayName: Build React
    - task: Docker@2
      displayName: Build and push image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(Build.SourcesDirectory)/$(dockerfilePath)
        containerRegistry: $(ACR_SERVICE_CONNECTION)
        tags: $(tag)

# Add a separately approved deployment stage using AzureCLI@2 and the
# production service connection. Keep secrets in Key Vault/variable groups.
